<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Flashcards &amp; Quiz</title>
<!-- KaTeX is the only external runtime dependency. Inline/localize these assets for air-gapped use. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
  :root {
    --bg: #f5f7fb;
    --panel: #ffffff;
    --text: #202534;
    --muted: #687386;
    --line: #dfe5ef;
    --accent: #4f46e5;
    --accent-2: #0891b2;
    --green: #16a34a;
    --red: #dc2626;
    --gold: #d97706;
    --shadow: 0 8px 28px rgba(23, 35, 64, 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f131c;
      --panel: #1a202c;
      --text: #edf1f7;
      --muted: #9aa6b8;
      --line: #303a4b;
      --accent: #818cf8;
      --accent-2: #22d3ee;
      --green: #4ade80;
      --red: #f87171;
      --gold: #fbbf24;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.65;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
  }
  .toprow {
    max-width: 1160px;
    margin: 0 auto;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 { margin: 0 14px 0 0; font-size: 19px; white-space: nowrap; }
  .modes { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .modes button, .chip, .btn {
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    font-weight: 650;
  }
  .modes button { border: 0; padding: 6px 13px; color: var(--muted); }
  .modes button.active { background: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 10px; border-radius: 999px; color: var(--muted); white-space: nowrap; }
  .chip:hover, .btn:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { border-color: var(--accent-2); background: var(--accent-2); color: #fff; }
  .search {
    flex: 1;
    min-width: 170px;
    padding: 7px 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    outline: none;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
  }
  .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .stat { color: var(--muted); font-size: 13px; font-weight: 650; white-space: nowrap; }
  main { max-width: 1160px; margin: 20px auto; padding: 0 18px 80px; }
  .card-wrap { max-width: 800px; margin: 0 auto; perspective: 1500px; }
  .card { position: relative; min-height: 355px; cursor: pointer; transform-style: preserve-3d; transition: transform .55s; }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 30px 34px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: var(--shadow);
    backface-visibility: hidden;
    overflow: auto;
  }
  .face.back { transform: rotateY(180deg); }
  .ftag { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 750; }
  .badge.ch { background: var(--accent-2); color: #fff; }
  .badge.diff { background: var(--accent); color: #fff; }
  .badge.diff.norm { background: var(--muted); }
  .badge.source { border: 1px solid var(--line); color: var(--muted); background: var(--bg); font-weight: 600; }
  .qtext { font-size: 21px; font-weight: 750; white-space: pre-wrap; }
  .atext { font-size: 16px; white-space: pre-wrap; }
  .hint { margin: 17px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
  .nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 9px; margin-top: 22px; }
  .btn { padding: 8px 14px; transition: .15s; }
  .btn.green { border-color: var(--green); background: var(--green); color: #fff; }
  .btn.red { border-color: var(--red); background: var(--red); color: #fff; }
  .btn.gold { border-color: var(--gold); color: var(--gold); }
  .btn:disabled { cursor: not-allowed; opacity: .45; }
  .counter { margin-top: 10px; color: var(--muted); text-align: center; font-size: 14px; font-weight: 650; }
  .quizbar { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
  .qlist { display: flex; flex-direction: column; gap: 14px; }
  .qcard { padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); }
  .qhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .qstem { font-size: 16px; font-weight: 700; white-space: pre-wrap; }
  .qtype { flex: 0 0 auto; padding: 3px 9px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 750; }
  .qtype.calc { background: var(--gold); }
  .qtype.concept { background: #8b5cf6; }
  .qanswer { display: none; margin-top: 14px; padding-top: 13px; border-top: 1px dashed var(--line); font-size: 15px; white-space: pre-wrap; }
  .qanswer.show { display: block; }
  .qanswer .lab { margin-bottom: 6px; color: var(--green); font-weight: 750; }
  .qfoot { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .verdict { color: var(--muted); font-size: 13px; font-weight: 700; }
  .verdict.correct { color: var(--green); }
  .verdict.wrong { color: var(--red); }
  .empty { padding: 60px 0; color: var(--muted); text-align: center; }
  .footer-note { margin-top: 30px; color: var(--muted); text-align: center; font-size: 12px; }
  @media (max-width: 680px) {
    h1 { width: 100%; }
    .card { min-height: 310px; }
    .face { padding: 23px 21px; }
    .qtext { font-size: 19px; }
  }
</style>
</head>
<body>
<header>
  <div class="toprow">
    <h1 id="deckTitle">Review Flashcards &amp; Quiz</h1>
    <div class="modes">
      <button id="modeCard" class="active" type="button">闪卡</button>
      <button id="modeQuiz" type="button">出题</button>
    </div>
    <div class="chips" id="chips"></div>
    <input class="search" id="search" type="search" placeholder="搜索关键词或公式" aria-label="搜索关键词或公式">
    <div class="stat" id="stat"></div>
  </div>
</header>

<main>
  <section id="cardView" aria-label="闪卡模式">
    <div class="card-wrap">
      <div class="card" id="card" role="button" tabindex="0" aria-label="点击翻转闪卡">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </div>
    </div>
    <div class="counter" id="counter"></div>
    <div class="nav">
      <button class="btn" id="prevBtn" type="button">上一张</button>
      <button class="btn" id="flipBtn" type="button">翻转（空格）</button>
      <button class="btn red" id="reviewBtn" type="button">再看看</button>
      <button class="btn green" id="masterBtn" type="button">我会了</button>
      <button class="btn" id="shuffleBtn" type="button">洗牌</button>
      <button class="btn" id="nextBtn" type="button">下一张</button>
      <button class="btn gold" id="exportBtn" type="button">导出待复习</button>
    </div>
    <p class="hint">点击卡片或按空格翻转；方向键切换；标记会自动保存到当前 deck 的本地浏览器存储。</p>
  </section>

  <section id="quizView" aria-label="出题模式" style="display:none">
    <div class="quizbar">
      <button class="btn" id="random10" type="button">抽 10 道混合题</button>
      <button class="btn" id="random20" type="button">抽 20 道</button>
      <button class="btn" id="showAll" type="button">全部题目</button>
      <button class="btn" id="resetQuiz" type="button">重置成绩</button>
      <span class="stat" id="quizStat"></span>
    </div>
    <div class="qlist" id="qlist"></div>
  </section>
  <p class="footer-note" id="footerNote"></p>
</main>

<script>
// The builder replaces the six JSON placeholders below. Keep the DECK_DATA marker pair intact:
// exportReview() uses it to create a standalone red-card deck.
const DECK = /* DECK_DATA */
{
  "topic": {{TOPIC_NAME_JSON}},
  "source": {{SOURCE_NOTE_JSON}},
  "namespace": {{STORAGE_NAMESPACE_JSON}},
  "chapters": {{CHAPTERS_JSON}},
  "cards": {{CARDS_JSON}},
  "quiz": {{QUIZ_JSON}}
}
/* /DECK_DATA */;

const MATH_OPTIONS = {
  delimiters: [
    {left: '$$', right: '$$', display: true},
    {left: '$', right: '$', display: false}
  ],
  throwOnError: false,
  strict: 'ignore'
};

let mode = 'card';
let chapter = 0;
let reviewOnly = false;
let order = [];
let pos = 0;
let flipped = false;
let quizSet = null;

function storageKey(kind) {
  return `qc-flashcards::${String(DECK.namespace || 'default')}::${kind}`;
}

function readState(kind) {
  try {
    const value = JSON.parse(localStorage.getItem(storageKey(kind)) || '{}');
    return value && typeof value === 'object' ? value : {};
  } catch (_) {
    return {};
  }
}

function writeState(kind, value) {
  try { localStorage.setItem(storageKey(kind), JSON.stringify(value)); } catch (_) { /* private mode */ }
}

let mastered = readState('mastered');
let quizResult = readState('quiz');

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function contentHtml(value) {
  return escapeHtml(value).replace(/\r?\n/g, '<br>');
}

function cardKey(card, index) {
  return String(card.id ?? `${card.ch}-${index}`);
}

function chapterName(ch) {
  return DECK.chapters && DECK.chapters[String(ch)] != null
    ? String(DECK.chapters[String(ch)])
    : `Chapter ${ch}`;
}

function cardMatches(card, index, keyword) {
  const text = `${card.q || ''} ${card.a || ''} ${card.source || ''}`.toLowerCase();
  return !keyword || text.includes(keyword);
}

function getFilteredCards() {
  const keyword = document.getElementById('search').value.trim().toLowerCase();
  return (DECK.cards || []).map((card, index) => ({card, index}))
    .filter(({card}) => chapter === 0 || String(card.ch) === String(chapter))
    .filter(({card, index}) => !reviewOnly || mastered[cardKey(card, index)] === 'red')
    .filter(({card, index}) => cardMatches(card, index, keyword));
}

function makeChip(label, value) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = `chip${value === chapter ? ' active' : ''}`;
  button.textContent = label;
  button.onclick = () => {
    chapter = value;
    quizSet = null;
    buildChips();
    applyFilter();
  };
  return button;
}

function countReview() {
  return (DECK.cards || []).filter((card, index) => mastered[cardKey(card, index)] === 'red').length;
}

function buildChips() {
  const container = document.getElementById('chips');
  container.innerHTML = '';
  container.appendChild(makeChip('全部', 0));
  Object.keys(DECK.chapters || {}).forEach((ch) => {
    container.appendChild(makeChip(`第${ch}章 ${chapterName(ch)}`, Number(ch)));
  });
  const reviewChip = document.createElement('button');
  reviewChip.type = 'button';
  reviewChip.className = `chip${reviewOnly ? ' active' : ''}`;
  reviewChip.textContent = `仅待复习（${countReview()}）`;
  reviewChip.onclick = () => {
    reviewOnly = !reviewOnly;
    buildChips();
    applyFilter();
  };
  container.appendChild(reviewChip);
}

function renderCard() {
  const cardElement = document.getElementById('card');
  const front = document.getElementById('front');
  const back = document.getElementById('back');
  if (!order.length) {
    front.innerHTML = '<div class="qtext">没有匹配的卡片</div><div class="hint">请换一个章节或搜索词。</div>';
    back.innerHTML = '';
    cardElement.classList.remove('flipped');
    document.getElementById('counter').textContent = '';
    return;
  }
  const index = order[pos];
  const card = DECK.cards[index];
  const state = mastered[cardKey(card, index)];
  const mark = state === 'green' ? '已掌握' : state === 'red' ? '待复习' : '';
  const markColor = state === 'green' ? 'var(--green)' : 'var(--red)';
  const source = card.source ? `<span class="badge source">${escapeHtml(card.source)}</span>` : '';
  front.innerHTML = `
    <div class="ftag">
      <span class="badge ch">第${escapeHtml(card.ch)}章 ${escapeHtml(chapterName(card.ch))}</span>
      <span class="badge diff ${card.diff ? '' : 'norm'}">${card.diff ? '核心' : '普通'}</span>
      ${mark ? `<span class="badge" style="background:${markColor};color:#fff">${mark}</span>` : ''}
    </div>
    <div class="qtext">${contentHtml(card.q)}</div>
    <div class="hint">点击或按空格查看答案</div>`;
  back.innerHTML = `
    <div class="ftag"><span class="badge ch">答案</span>${source}</div>
    <div class="atext">${contentHtml(card.a)}</div>`;
  cardElement.classList.toggle('flipped', flipped);
  const green = (DECK.cards || []).filter((item, i) => mastered[cardKey(item, i)] === 'green').length;
  document.getElementById('counter').textContent = `第 ${pos + 1} / ${order.length} 张 · 已掌握 ${green} / ${(DECK.cards || []).length}`;
  renderMath(cardElement);
}

function applyFilter() {
  if (mode === 'card') {
    order = getFilteredCards().map(({index}) => index);
    pos = 0;
    flipped = false;
    renderCard();
  } else {
    renderQuiz();
  }
  updateStat();
}

function flip() {
  if (!order.length) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
}

function next() {
  if (!order.length) return;
  pos = (pos + 1) % order.length;
  flipped = false;
  renderCard();
}

function prev() {
  if (!order.length) return;
  pos = (pos - 1 + order.length) % order.length;
  flipped = false;
  renderCard();
}

function shuffle() {
  for (let i = order.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  renderCard();
}

function mark(color) {
  if (!order.length) return;
  const index = order[pos];
  const key = cardKey(DECK.cards[index], index);
  if (mastered[key] === color) delete mastered[key];
  else mastered[key] = color;
  writeState('mastered', mastered);
  buildChips();
  renderCard();
  updateStat();
}

function renderQuiz() {
  const list = document.getElementById('qlist');
  list.innerHTML = '';
  const keyword = document.getElementById('search').value.trim().toLowerCase();
  let items = quizSet
    ? (DECK.quiz || []).filter((item) => quizSet.includes(item.id))
    : (DECK.quiz || []).filter((item) => chapter === 0 || String(item.ch) === String(chapter))
      .filter((item) => cardMatches(item, item.id, keyword));
  if (!items.length) {
    list.innerHTML = '<div class="empty">没有匹配的题目</div>';
    updateQuizStat();
    return;
  }
  items.forEach((item) => {
    const result = quizResult[item.id];
    const element = document.createElement('div');
    element.className = 'qcard';
    const source = item.source ? `<span class="badge source">${escapeHtml(item.source)}</span>` : '';
    element.innerHTML = `
      <div class="qhead">
        <div class="qstem">${contentHtml(item.q)}</div>
        <span class="qtype ${item.type}">${item.type === 'calc' ? '计算' : '概念'}</span>
      </div>
      <div class="qanswer" id="answer-${item.id}"><div class="lab">参考答案</div>${contentHtml(item.a)}</div>
      <div class="qfoot">
        <button class="btn" type="button" data-action="toggle-answer">显示/隐藏答案</button>
        <button class="btn green" type="button" data-action="correct">答对</button>
        <button class="btn red" type="button" data-action="wrong">答错</button>
        <span class="verdict ${result || ''}">${result ? `已评：${result === 'correct' ? '答对' : '答错'}` : '未评分'}</span>
        <span class="badge ch">第${escapeHtml(item.ch)}章</span>${source}
      </div>`;
    element.querySelector('[data-action="toggle-answer"]').onclick = () => {
      element.querySelector('.qanswer').classList.toggle('show');
      renderMath(element);
    };
    element.querySelector('[data-action="correct"]').onclick = () => gradeQuiz(item.id, 'correct');
    element.querySelector('[data-action="wrong"]').onclick = () => gradeQuiz(item.id, 'wrong');
    list.appendChild(element);
    renderMath(element);
  });
  updateQuizStat();
}

function gradeQuiz(id, result) {
  if (quizResult[id] === result) delete quizResult[id];
  else quizResult[id] = result;
  writeState('quiz', quizResult);
  renderQuiz();
}

function quizRandom(number) {
  const pool = (DECK.quiz || []).filter((item) => chapter === 0 || String(item.ch) === String(chapter));
  const ids = pool.map((item) => item.id);
  const picked = [];
  const amount = Math.min(number, ids.length);
  for (let i = 0; i < amount; i += 1) {
    const index = Math.floor(Math.random() * ids.length);
    picked.push(ids.splice(index, 1)[0]);
  }
  quizSet = picked;
  renderQuiz();
}

function quizShowAll() { quizSet = null; renderQuiz(); }

function quizReset() { quizResult = {}; writeState('quiz', quizResult); renderQuiz(); }

function setMode(value) {
  mode = value;
  document.getElementById('modeCard').classList.toggle('active', value === 'card');
  document.getElementById('modeQuiz').classList.toggle('active', value === 'quiz');
  document.getElementById('cardView').style.display = value === 'card' ? '' : 'none';
  document.getElementById('quizView').style.display = value === 'quiz' ? '' : 'none';
  applyFilter();
}

function updateStat() {
  if (mode !== 'card') {
    document.getElementById('stat').textContent = '';
    return;
  }
  const green = Object.values(mastered).filter((value) => value === 'green').length;
  document.getElementById('stat').textContent = `掌握 ${green}/${(DECK.cards || []).length} · 待复习 ${countReview()}`;
}

function updateQuizStat() {
  const total = Object.keys(quizResult).length;
  const correct = Object.values(quizResult).filter((value) => value === 'correct').length;
  const rate = total ? Math.round(correct / total * 100) : 0;
  document.getElementById('quizStat').textContent = total ? `已答 ${total} · 答对 ${correct} · 正确率 ${rate}%` : '';
}

function renderMath(root) {
  if (window.renderMathInElement && root) {
    window.renderMathInElement(root, MATH_OPTIONS);
  }
}

function safeJson(value) {
  return JSON.stringify(value)
    .replace(/</g, '\\u003c')
    .replace(/>/g, '\\u003e')
    .replace(/&/g, '\\u0026')
    .replace(/\u2028/g, '\\u2028')
    .replace(/\u2029/g, '\\u2029');
}

function slugify(value) {
  const slug = String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  return slug || 'flashcards';
}

function exportReview() {
  const picks = (DECK.cards || []).map((card, index) => ({card, index}))
    .filter(({card, index}) => mastered[cardKey(card, index)] === 'red');
  if (!picks.length) {
    alert('当前没有标记为“再看看”的卡片。请先在闪卡模式中标记。');
    return;
  }
  const reviewDeck = {
    ...DECK,
    topic: `${DECK.topic} · 待复习`,
    source: `${DECK.source || ''} · exported review subset`,
    namespace: `${DECK.namespace || 'default'}::review`,
    cards: picks.map(({card}) => card)
  };
  const pattern = /const DECK = \/\* DECK_DATA \*\/[\s\S]*?\/\* \/DECK_DATA \*\//;
  const replacement = () => `const DECK = /* DECK_DATA */\n${safeJson(reviewDeck)}\n/* /DECK_DATA */`;
  const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML.replace(pattern, replacement);
  const blob = new Blob([html], {type: 'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement('a');
  anchor.href = url;
  anchor.download = `${slugify(DECK.topic)}-review-subset.html`;
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function bindEvents() {
  document.getElementById('modeCard').onclick = () => setMode('card');
  document.getElementById('modeQuiz').onclick = () => setMode('quiz');
  document.getElementById('search').oninput = applyFilter;
  document.getElementById('card').onclick = flip;
  document.getElementById('card').onkeydown = (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); flip(); }
  };
  document.getElementById('prevBtn').onclick = prev;
  document.getElementById('flipBtn').onclick = flip;
  document.getElementById('reviewBtn').onclick = () => mark('red');
  document.getElementById('masterBtn').onclick = () => mark('green');
  document.getElementById('shuffleBtn').onclick = shuffle;
  document.getElementById('nextBtn').onclick = next;
  document.getElementById('exportBtn').onclick = exportReview;
  document.getElementById('random10').onclick = () => quizRandom(10);
  document.getElementById('random20').onclick = () => quizRandom(20);
  document.getElementById('showAll').onclick = quizShowAll;
  document.getElementById('resetQuiz').onclick = quizReset;
  document.addEventListener('keydown', (event) => {
    if (event.target.tagName === 'INPUT' || mode !== 'card') return;
    if (event.code === 'Space') { event.preventDefault(); flip(); }
    else if (event.key === 'ArrowRight') next();
    else if (event.key === 'ArrowLeft') prev();
  });
}

window.addEventListener('load', () => {
  document.title = `${DECK.topic || 'Review'} · Flashcards & Quiz`;
  document.getElementById('deckTitle').textContent = `${DECK.topic || 'Review'} · 闪卡与出题`;
  document.getElementById('footerNote').textContent = `来源：${DECK.source || '本 vault 复习材料'} · 无后端 · 进度保存在当前浏览器`;
  bindEvents();
  buildChips();
  setMode('card');
  const waitForMath = () => {
    if (window.renderMathInElement) renderMath(document.body);
    else setTimeout(waitForMath, 150);
  };
  waitForMath();
});
</script>
</body>
</html>
